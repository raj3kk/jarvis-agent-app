name: Build Jarvis Autonomous APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1.4.5 (item 7): PR builds get a DISTINCT artifact name so a
      # PR debug build can never be mistaken for a release build.
      # Push/workflow_dispatch keep the exact name Jarvis2026-APK
      # (the download script depends on it).
      - name: Set artifact suffix (PR builds only)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "ARTIFACT_SUFFIX=-pr-${{ github.event.number }}" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi
          echo "Artifact suffix: '${{ env.ARTIFACT_SUFFIX }}'"

      # 1.4.5 (item 7): versionCode MUST exceed the previous
      # delivered versionCode, or the build fails. Floor is the
      # last delivered vc (49 = 1.13.0) — BUMP THIS FLOOR ON
      # EVERY RELEASE (it is not read from any API: releases are
      # artifacts, not GitHub Releases, so no releases-API check
      # is available). A same-or-lower vc would install as "not
      # an upgrade" / fail to install over the previous release.
      - name: Assert versionCode greater than previous release
        run: |
          set -e
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "versionCode in tree: $VC (floor PREV_VC=49, previous delivered 1.13.0)"
          test -n "$VC"
          # NOTE: bump PREV_VC below on every release.
          PREV_VC=49
          if [ "$VC" -le "$PREV_VC" ]; then
            echo "FAIL: versionCode $VC is not greater than previous delivered $PREV_VC — bump versionCode first."
            exit 1
          fi

      # 1.9.0 (v2, DESIGN §5.7): the learned-pattern store is
      # on-device only — maybeUploadLearnedPattern must never
      # read it. Fail the build if the uploader's body references
      # the new store (mirrors the unit test in
      # LearnedPatternStoreTest.uploaderNeverReadsThePatternStore).
      - name: Enforce pattern store stays on-device (§5.7)
        run: |
          python3 - <<'PY'
          import sys
          src = open("app/src/main/java/com/jarvis/autonomous/agent/JarvisAgentEngine.kt").read()
          idx = src.find("fun maybeUploadLearnedPattern")
          assert idx >= 0, "maybeUploadLearnedPattern not found"
          brace = src.index("{", idx)
          depth, end = 0, brace
          for i in range(brace, len(src)):
              if src[i] == "{": depth += 1
              elif src[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          body = src[brace:end]
          for banned in ("LearnedPatternStore", "PatternStorage", "FilePatternStorage", "LearnedInstruction"):
              if banned in body:
                  print(f"FAIL: maybeUploadLearnedPattern references {banned} — patterns must stay on-device")
                  sys.exit(1)
          print("§5.7 OK: uploader never reads the pattern store")
          PY

      # 1.9.0 (v2, DESIGN §4.4): only the VERIFIED line may claim
      # completion ("Ho gaya bhai!"). Two lines deliberately contain
      # the words without claiming it — the Q3 UNVERIFIED hedge
      # ("Ho gaya lagta hai…") and the timeout line ("Time khatm
      # ho gaya"). Fail the build if any other code line contains
      # the words (mirrors the unit test in
      # TalkerVerificationPolicyTest).
      - name: Verify no completion claim outside the VERIFIED line
        run: |
          python3 - <<'PY'
          import sys
          path = "app/src/main/java/com/jarvis/autonomous/agent/TalkerVerificationPolicy.kt"
          src = open(path).read()
          idx = src.find("fun verifiedLine")
          assert idx >= 0, "verifiedLine not found"
          brace = src.index("{", idx)
          depth, end = 0, brace
          for i in range(brace, len(src)):
              if src[i] == "{": depth += 1
              elif src[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          rest = src[:brace] + src[end:]
          bad = []
          for line in rest.splitlines():
              t = line.strip()
              # Comments state the rule; only code lines are checked.
              if t.startswith("*") or t.startswith("/**") or t.startswith("*/") or t.startswith("//"):
                  continue
              low = t.lower()
              if "ho gaya" not in low:
                  continue
              if "ho gaya lagta hai" in low or "time khatm ho gaya" in low:
                  continue
              bad.append(t)
          if bad:
              print("FAIL: non-verified code line claims completion:")
              for l in bad: print("  " + l)
              sys.exit(1)
          print("OK: only the VERIFIED line claims completion")
          PY

      # 1.13.0 Gecko browser: C1 mitigation + bridge-design gates.
      # (a) The extension manifest version MUST equal the NUMERIC part
      # of the app versionName on every release (manifest versions are
      # digits-and-dots only, so "1.13.0-PRO" maps to "1.13.0") — a
      # version bump forces ADDON_UPGRADE + updateReason, which makes
      # Gecko build the background directly instead of relying on the
      # APP_STARTUP fallback that silently never started it in the
      # spike's persisted runs.
      # (b) content.js must NEVER call connectNative (the
      # content-script native port died silently twice); only
      # background.js may own the native port.
      - name: Enforce Gecko extension version + bridge design
        run: |
          set -e
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "versionName in tree: $VN"
          test -n "$VN"
          VN_NUM=$(echo "$VN" | sed 's/-.*//')
          echo "versionName numeric part: $VN_NUM"
          EXT_V=$(python3 -c "import json; print(json.load(open('app/src/main/assets/jarvis-bridge/manifest.json'))['version'])")
          echo "extension manifest version: $EXT_V"
          if [ "$EXT_V" != "$VN_NUM" ]; then
            echo "FAIL: extension version $EXT_V != app versionName numeric part $VN_NUM — bump the manifest on every release (C1 mitigation)."
            exit 1
          fi
          if grep -q "connectNative(" app/src/main/assets/jarvis-bridge/content.js; then
            echo "FAIL: content.js calls connectNative — the background script must own the native port."
            exit 1
          fi
          grep -q "connectNative(" app/src/main/assets/jarvis-bridge/background.js || (echo "FAIL: background.js must own the native port (connectNative missing)."; exit 1)
          echo "Gecko extension gates OK: version $EXT_V, background-owned native port"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # NOTE: android-actions/setup-android@v3 defaults to installing the
      # obsolete 'tools' package, which sdkmanager no longer provides, so
      # that step fails the whole job. ubuntu-latest already ships an
      # Android SDK, so just ensure the exact platform/build-tools we need.
      # 1.13.0: platform 36 added (compileSdk 36 for GeckoView 160.x —
      # spike CI proved it installs on the runner).
      - name: Ensure Android SDK packages (platform 34 + 36, build-tools 34.0.0)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "platforms;android-36" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (uses gradlew wrapper, Gradle 8.13)
        uses: gradle/actions/setup-gradle@v3

      # Production signing (optional, secret-gated):
      # If the repo has ANDROID_KEYSTORE_BASE64 + passwords set as Secrets,
      # decode them into keystore.properties + release.keystore (gitignored).
      # If not set, the build falls back to the debug key and the verify
      # step below labels the APK debug-signed — it is NOT claimed as
      # production-signed in that case.
      # NOTE: secrets cannot be used in an `if:` expression (GitHub rejects
      # the workflow at parse time with "Unrecognized named-value: 'secrets'").
      # So this step always runs and checks the variable inside bash instead.
      - name: Restore release keystore from Secrets (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No production keystore configured — release will use the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Run unit tests (I1 device-memory + I2 talker-executor + all unit tests)
        # 1.7.1 (I1) + 1.8.0 (I2): tests are a gate, not an
        # afterthought — a test failure fails the build before any
        # APK is assembled. Runs on the JVM (JUnit4 + Robolectric,
        # no emulator/device).
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug & Release APK
        # 2b-3 (B1 fix): no HF_TOKEN env any more — the gated Gemma
        # download uses only the user-entered token (AI Brain). The
        # old BuildConfig.HF_TOKEN secret is deleted from code + here.
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APKs (exist + badging + signature)
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | head -5
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -20
          # 1.4.5 (item 7): SIGNING PIN + debug-fallback FAIL (not
          # just a label any more). On push/workflow_dispatch a
          # missing keystore.properties FAILS the build (a release
          # must never silently ship debug-signed). On
          # pull_request, fork PRs have no secrets by GitHub
          # design, so a missing keystore only warns — and the PR
          # artifact name (see suffix step) marks it as a PR build.
          # Whenever keystore.properties EXISTS, the cert MUST be
          # the pinned release cert (DN + SHA-256 are public
          # fingerprints, safe to commit), else exit 1.
          if [ -f keystore.properties ]; then
            echo "SIGNING=production-keystore"
            CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk)
            echo "$CERTS" | grep -F "CN=Jarvis2026" || (echo "FAIL: cert DN does not contain CN=Jarvis2026"; exit 1)
            echo "$CERTS" | grep -F "4157240d19a33c4752ac72b5ffcd5bfd0a9c1812c61a36179582a262a7c66026" || (echo "FAIL: cert SHA-256 does not match the pinned release cert"; exit 1)
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "SIGNING=debug-fallback (pull_request: secrets unavailable by design — PR artifact only)"
            else
              echo "SIGNING=debug-fallback — FAILING (production keystore required on push/workflow_dispatch)"
              exit 1
            fi
          fi
          # 1.4.12 NEGATIVE gate: the release APK must NOT
          # carry any bundled voice-model assets (Swara is
          # cloud-only — no assets/kokoro/ any more).
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "Checking no bundled voice assets in $APK"
            if unzip -l "$APK" | grep -qE "assets/kokoro/"; then echo "FAIL: bundled voice assets present in $APK"; exit 1; fi
          done

      - name: Rename release APK to Jarvis2026.apk
        run: |
          set -e
          cp app/build/outputs/apk/release/*.apk Jarvis2026.apk
          ls -lh Jarvis2026.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Autonomous-Debug-APK${{ env.ARTIFACT_SUFFIX }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis2026-APK${{ env.ARTIFACT_SUFFIX }}
          path: Jarvis2026.apk
          retention-days: 30
