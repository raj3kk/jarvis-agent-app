name: Build Jarvis Autonomous APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1.4.5 (item 7): PR builds get a DISTINCT artifact name so a
      # PR debug build can never be mistaken for a release build.
      # Push/workflow_dispatch keep the exact name Jarvis2026-APK
      # (the download script depends on it).
      - name: Set artifact suffix (PR builds only)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "ARTIFACT_SUFFIX=-pr-${{ github.event.number }}" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi
          echo "Artifact suffix: '${{ env.ARTIFACT_SUFFIX }}'"

      # 1.4.5 (item 7): versionCode MUST exceed the previous
      # delivered versionCode, or the build fails. Floor is the
      # last delivered vc (21 = 1.4.13-PRO) — BUMP THIS FLOOR ON
      # EVERY RELEASE (it is not read from any API: releases are
      # artifacts, not GitHub Releases, so no releases-API check
      # is available). A same-or-lower vc would install as "not
      # an upgrade" / fail to install over the previous release.
      - name: Assert versionCode greater than previous release
        run: |
          set -e
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "versionCode in tree: $VC (floor PREV_VC=21, previous delivered 1.4.13-PRO)"
          test -n "$VC"
          # NOTE: bump PREV_VC below on every release.
          PREV_VC=21
          if [ "$VC" -le "$PREV_VC" ]; then
            echo "FAIL: versionCode $VC is not greater than previous delivered $PREV_VC — bump versionCode first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # NOTE: android-actions/setup-android@v3 defaults to installing the
      # obsolete 'tools' package, which sdkmanager no longer provides, so
      # that step fails the whole job. ubuntu-latest already ships an
      # Android SDK, so just ensure the exact platform/build-tools we need.
      - name: Ensure Android SDK packages (platform 34, build-tools 34.0.0)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (uses gradlew wrapper, Gradle 8.7)
        uses: gradle/actions/setup-gradle@v3

      # Production signing (optional, secret-gated):
      # If the repo has ANDROID_KEYSTORE_BASE64 + passwords set as Secrets,
      # decode them into keystore.properties + release.keystore (gitignored).
      # If not set, the build falls back to the debug key and the verify
      # step below labels the APK debug-signed — it is NOT claimed as
      # production-signed in that case.
      # NOTE: secrets cannot be used in an `if:` expression (GitHub rejects
      # the workflow at parse time with "Unrecognized named-value: 'secrets'").
      # So this step always runs and checks the variable inside bash instead.
      - name: Restore release keystore from Secrets (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No production keystore configured — release will use the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # Sherpa-ONNX AAR for Silero VAD (never committed):
      # downloaded fresh each build, size-checked (37,631,864 bytes).
      - name: Download Sherpa-ONNX AAR (Silero VAD engine)
        run: |
          mkdir -p app/libs
          curl -sL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-static-link-onnxruntime-1.13.4.aar
          ls -lh app/libs/sherpa-onnx.aar
          test $(stat -c%s app/libs/sherpa-onnx.aar) -eq 37631864


      # Silero VAD model — BUNDLED IN CI, NEVER COMMITTED:
      # same pattern as the old bundle steps. URL verified
      # 2026-11-03 via HEAD before use: HTTP 200,
      # application/octet-stream, 643,854 bytes, from the
      # sherpa-onnx asr-models release (also referenced by
      # sherpa-onnx's own flutter/wasm VAD examples). The exact
      # byte check below fails loudly if GitHub ever serves a
      # different build, instead of silently shipping it.
      - name: Bundle Silero VAD model asset (CI-only, never committed)
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -sL -o app/src/main/assets/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          VAD_BYTES=$(stat -c%s app/src/main/assets/silero_vad.onnx)
          echo "Silero VAD bytes: $VAD_BYTES (expected 643854)"
          test "$VAD_BYTES" -eq 643854
          # 1.4.12: VAD hash pin (mirrored in code as AlwaysOnMicManager PIN_VAD_*).
          test "$(sha256sum app/src/main/assets/silero_vad.onnx | cut -d' ' -f1)" = "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6"

      - name: Build Debug & Release APK
        # Owner's HF token (read-only Gemma-download token) goes into
        # BuildConfig.HF_TOKEN so the end user enters no token. The
        # value is masked by GitHub in logs; Gradle never prints it.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APKs (exist + badging + signature)
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | head -5
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -20
          # 1.4.5 (item 7): SIGNING PIN + debug-fallback FAIL (not
          # just a label any more). On push/workflow_dispatch a
          # missing keystore.properties FAILS the build (a release
          # must never silently ship debug-signed). On
          # pull_request, fork PRs have no secrets by GitHub
          # design, so a missing keystore only warns — and the PR
          # artifact name (see suffix step) marks it as a PR build.
          # Whenever keystore.properties EXISTS, the cert MUST be
          # the pinned release cert (DN + SHA-256 are public
          # fingerprints, safe to commit), else exit 1.
          if [ -f keystore.properties ]; then
            echo "SIGNING=production-keystore"
            CERTS=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk)
            echo "$CERTS" | grep -F "CN=Jarvis2026" || (echo "FAIL: cert DN does not contain CN=Jarvis2026"; exit 1)
            echo "$CERTS" | grep -F "4157240d19a33c4752ac72b5ffcd5bfd0a9c1812c61a36179582a262a7c66026" || (echo "FAIL: cert SHA-256 does not match the pinned release cert"; exit 1)
          else
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "SIGNING=debug-fallback (pull_request: secrets unavailable by design — PR artifact only)"
            else
              echo "SIGNING=debug-fallback — FAILING (production keystore required on push/workflow_dispatch)"
              exit 1
            fi
          fi
          # 1.4.12 NEGATIVE gate: the release APK must NOT
          # carry any bundled voice-model assets (Swara is
          # cloud-only — no assets/kokoro/ any more).
          # 1.4.5 (item 7): IN-APK hash check — defense in depth
          # (bundle source vs shipped bytes): extract the APK's
          # assets and verify exact sizes + SHA-256 of what
          # actually SHIPS, against the same pins (VAD only now).
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "Checking no bundled voice assets + VAD in $APK"
            if unzip -l "$APK" | grep -qE "assets/kokoro/"; then echo "FAIL: bundled voice assets present in $APK"; exit 1; fi
            # 1.4.0 gate: the release APK MUST carry the bundled Silero VAD model.
            unzip -l "$APK" | grep -F "assets/silero_vad.onnx" || (echo "MISSING bundled Silero VAD model in $APK"; exit 1)
            APK_TMP=$(mktemp -d)
            unzip -p "$APK" "assets/silero_vad.onnx" > "$APK_TMP/silero_vad.onnx"
            test "$(stat -c%s "$APK_TMP/silero_vad.onnx")" -eq 643854
            test "$(sha256sum "$APK_TMP/silero_vad.onnx" | cut -d' ' -f1)" = "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6"
            echo "In-APK asset sizes + hashes verified for $APK"
            rm -rf "$APK_TMP"
          done

      - name: Rename release APK to Jarvis2026.apk
        run: |
          set -e
          cp app/build/outputs/apk/release/*.apk Jarvis2026.apk
          ls -lh Jarvis2026.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Autonomous-Debug-APK${{ env.ARTIFACT_SUFFIX }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis2026-APK${{ env.ARTIFACT_SUFFIX }}
          path: Jarvis2026.apk
          retention-days: 30
