name: Build Jarvis Autonomous APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # NOTE: android-actions/setup-android@v3 defaults to installing the
      # obsolete 'tools' package, which sdkmanager no longer provides, so
      # that step fails the whole job. ubuntu-latest already ships an
      # Android SDK, so just ensure the exact platform/build-tools we need.
      - name: Ensure Android SDK packages (platform 34, build-tools 34.0.0)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle (uses gradlew wrapper, Gradle 8.7)
        uses: gradle/actions/setup-gradle@v3

      # Production signing (optional, secret-gated):
      # If the repo has ANDROID_KEYSTORE_BASE64 + passwords set as Secrets,
      # decode them into keystore.properties + release.keystore (gitignored).
      # If not set, the build falls back to the debug key and the verify
      # step below labels the APK debug-signed — it is NOT claimed as
      # production-signed in that case.
      # NOTE: secrets cannot be used in an `if:` expression (GitHub rejects
      # the workflow at parse time with "Unrecognized named-value: 'secrets'").
      # So this step always runs and checks the variable inside bash instead.
      - name: Restore release keystore from Secrets (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No production keystore configured — release will use the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # Sherpa-ONNX AAR for Kokoro offline voice (never committed):
      # downloaded fresh each build, size-checked (37,631,864 bytes).
      - name: Download Sherpa-ONNX AAR (Kokoro voice engine)
        run: |
          mkdir -p app/libs
          curl -sL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-static-link-onnxruntime-1.13.4.aar
          ls -lh app/libs/sherpa-onnx.aar
          test $(stat -c%s app/libs/sherpa-onnx.aar) -eq 37631864

      # Kokoro model assets — BUNDLED IN CI, NEVER COMMITTED:
      # downloads the sherpa-onnx kokoro-int8-multi-lang-v1_0
      # tarball (verified 2026-11-02: HTTP 200, 132,353,410 bytes
      # via GitHub release API + full-download size check) and
      # extracts it into app/src/main/assets/kokoro/ BEFORE the
      # Gradle build, so the APK carries the model. The workflow
      # never commits these files — they exist only in this
      # runner. Unpacked size ~190 MB (model.int8.onnx ~109 MB).
      # If this URL 404s in future, the fallback is the HF
      # unpacked files (csukuangfj/kokoro-int8-multi-lang-v1_0
      # via the HF tree API, as 1.3.0 downloaded on-device) —
      # do NOT silently switch to a different model version.
      - name: Bundle Kokoro model assets (CI-only, never committed)
        run: |
          set -e
          mkdir -p app/src/main/assets/kokoro /tmp/kokoro-unpack
          curl -sL -o /tmp/kokoro-int8-multi-lang-v1_0.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_0.tar.bz2
          TARBALL_BYTES=$(stat -c%s /tmp/kokoro-int8-multi-lang-v1_0.tar.bz2)
          echo "Kokoro tarball bytes: $TARBALL_BYTES (expected ~132353410)"
          test "$TARBALL_BYTES" -ge 100000000
          tar -xjf /tmp/kokoro-int8-multi-lang-v1_0.tar.bz2 -C /tmp/kokoro-unpack
          MODEL_FILE=$(find /tmp/kokoro-unpack -name model.int8.onnx | head -1)
          test -n "$MODEL_FILE"
          MODEL_DIR=$(dirname "$MODEL_FILE")
          echo "Kokoro model dir in tarball: $MODEL_DIR"
          cp -r "$MODEL_DIR"/. app/src/main/assets/kokoro/
          test -f app/src/main/assets/kokoro/model.int8.onnx
          MODEL_BYTES=$(stat -c%s app/src/main/assets/kokoro/model.int8.onnx)
          echo "Bundled model.int8.onnx bytes: $MODEL_BYTES (must be > 50000000)"
          test "$MODEL_BYTES" -gt 50000000
          test -f app/src/main/assets/kokoro/voices.bin
          test -f app/src/main/assets/kokoro/tokens.txt
          test -d app/src/main/assets/kokoro/espeak-ng-data
          du -sh app/src/main/assets/kokoro/
          ls -lh app/src/main/assets/kokoro/ | head -20
          rm -rf /tmp/kokoro-unpack /tmp/kokoro-int8-multi-lang-v1_0.tar.bz2

      - name: Build Debug & Release APK
        # Owner's HF token (read-only Gemma-download token) goes into
        # BuildConfig.HF_TOKEN so the end user enters no token. The
        # value is masked by GitHub in logs; Gradle never prints it.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APKs (exist + badging + signature)
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "aapt2: $AAPT2"
          "$AAPT2" dump badging app/build/outputs/apk/release/*.apk | head -5
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -20
          if [ -f keystore.properties ]; then echo "SIGNING=production-keystore"; else echo "SIGNING=debug-fallback"; fi
          # 1.4.0 gate: the release APK MUST carry the bundled Kokoro model.
          for APK in app/build/outputs/apk/release/*.apk; do
            echo "Checking bundled Kokoro assets in $APK"
            unzip -l "$APK" | grep -E "assets/kokoro/model\.int8\.onnx" || (echo "MISSING bundled Kokoro model in $APK"; exit 1)
            unzip -l "$APK" | grep -E "assets/kokoro/voices\.bin" || (echo "MISSING bundled Kokoro voices in $APK"; exit 1)
          done

      - name: Rename release APK to Jarvis2026.apk
        run: |
          set -e
          cp app/build/outputs/apk/release/*.apk Jarvis2026.apk
          ls -lh Jarvis2026.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Autonomous-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis2026-APK
          path: Jarvis2026.apk
          retention-days: 30
