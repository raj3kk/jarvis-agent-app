org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# 1.15.0 (R0): Jetifier ON — DSBridge is pre-AndroidX (its classes
# reference android.support.v7.app.AlertDialog + android.support
# .annotation.Keep). Jetifier rewrites those references to the
# androidx equivalents, so the excluded appcompat-v7 is replaced by
# the direct androidx.appcompat dep (app/build.gradle.kts).
# NOTE: Jetifier ALONE does not fix the duplicate classes (commit #6
# PROVED it, CI 45136651748): the colliding classes are AIDL
# interfaces (android.support.v4.os.ResultReceiver,
# INotificationSideChannel) that Jetifier deliberately never rewrites
# (their package is part of the Binder wire protocol) and that
# androidx.core also ships under the same package — so the ONLY fix
# is excluding support-v4 + appcompat-v7 from DSBridge (see the dep
# comment). Jetifier stays on for the AlertDialog/Keep rewrite.
kotlin.code.style=official
android.nonTransitiveRClass=true
