org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# 1.15.0 (R0): Jetifier ON — DSBridge is pre-AndroidX (its pom depends
# on appcompat-v7:23.4.0, which pulls support-v4:23.4.0). Without
# Jetifier the build fails at :app:checkDebugDuplicateClasses
# (android.support.v4.os.ResultReceiver etc. exist in BOTH
# support-v4:23.4.0 and androidx.core:1.13.1 — CI 45135413509).
# Jetifier rewrites DSBridge's classes + its support libs to their
# AndroidX equivalents (AlertDialog -> androidx.appcompat, Keep ->
# androidx.annotation), so the duplicates vanish AND DWebView's dialog
# code keeps working. A blanket exclude of com.android.support would
# be WRONG: DWebView calls AlertDialog.Builder at runtime (its classes
# reference android.support.v7.app.AlertDialog), and appcompat-v7
# itself needs support-v4 — excluding would crash on first use.
kotlin.code.style=official
android.nonTransitiveRClass=true
